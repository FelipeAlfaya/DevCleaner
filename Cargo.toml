[workspace]
resolver = "2"
members = ["crates/core", "crates/app", "crates/gpui-app"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["Felipe Alfaya"]
repository = "https://github.com/FelipeAlfaya/AlfaCleaner"
homepage = "https://github.com/FelipeAlfaya/AlfaCleaner"

[workspace.dependencies]
crossbeam-channel = "0.5"
directories = "6"
jwalk = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Optimize dependencies (gpui, egui, ...) even in debug builds: without it
# animations and scrolling stutter in `cargo run`. Our own crates stay
# unoptimized, so rebuilding after a change is still fast.
[profile.dev.package."*"]
opt-level = 2

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# gpui (used by crates/gpui-app) pulls xattr 0.2, which no longer builds on
# Linux with current libc releases (ENOATTR was removed there). The vendored
# copy only maps ENOATTR to ENODATA on Linux; see vendor/xattr/src/sys/mod.rs.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
