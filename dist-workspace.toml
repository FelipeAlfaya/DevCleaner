[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-apple-darwin"]
# Path that installers should place binaries in
install-path = "~/.devcleaner/bin"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# The MSI template (crates/app/wix/main.wxs) is customized for a desktop app:
# Start Menu shortcut and icon instead of a PATH entry. Keep dist from
# regenerating it.
allow-dirty = ["msi"]
# Pull requests only check that the release plan is valid.
pr-run-mode = "plan"
